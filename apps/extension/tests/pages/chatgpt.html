<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Página de prueba · ChatGPT</title>
    <style>
      body { font: 15px/1.5 system-ui, sans-serif; margin: 0; background: #fff; color: #0d0d0d; }
      main { max-width: 760px; margin: 0 auto; padding: 24px 16px 220px; }
      [data-message-author-role="user"] { background: #f4f4f4; border-radius: 18px; padding: 8px 16px; margin: 16px 0 16px auto; width: fit-content; max-width: 70%; white-space: pre-wrap; }
      [data-message-author-role="assistant"] { margin: 16px 0; }
      form { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); width: min(760px, calc(100% - 32px)); border: 1px solid #ddd; border-radius: 26px; padding: 12px 56px 12px 18px; box-shadow: 0 4px 16px rgba(0,0,0,.06); background: #fff; }
      #prompt-textarea { outline: none; min-height: 24px; max-height: 200px; overflow: auto; }
      #prompt-textarea p { margin: 0; }
      #composer-submit-button { position: absolute; right: 10px; bottom: 10px; width: 36px; height: 36px; border-radius: 50%; border: 0; background: #0d0d0d; color: #fff; cursor: pointer; }
    </style>
    <script src="/fake-prosemirror.js"></script>
  </head>
  <body>
    <main id="thread"></main>
    <form id="composer" onsubmit="return false">
      <div id="prompt-textarea"></div>
      <button id="composer-submit-button" data-testid="send-button" type="button" aria-label="Enviar indicación">↑</button>
    </form>
    <script>
      window.__sent = [];
      const thread = document.getElementById("thread");
      const editor = FakeProseMirror.createEditor(document.getElementById("prompt-textarea"), { onSubmit: send });
      document.getElementById("composer-submit-button").addEventListener("click", send);
      function send() {
        const text = editor.getText();
        if (!text.trim()) return;
        window.__sent.push(text);
        const bubble = document.createElement("div");
        bubble.dataset.messageAuthorRole = "user";
        bubble.textContent = text;
        thread.append(bubble);
        editor.clear();
        if (!location.pathname.startsWith("/c/")) history.pushState({}, "", "/c/conv-prueba-1");
      }
      window.__reply = async (text) => {
        const msg = document.createElement("div");
        msg.dataset.messageAuthorRole = "assistant";
        const md = document.createElement("div");
        md.className = "markdown prose";
        const p = document.createElement("p");
        md.append(p);
        msg.append(md);
        thread.append(msg);
        await FakeProseMirror.streamInto(p, text);
      };
    </script>
  </body>
</html>
