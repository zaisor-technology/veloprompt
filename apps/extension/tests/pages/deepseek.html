<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Página de prueba · DeepSeek</title>
    <style>
      body { font: 16px/1.6 system-ui, sans-serif; margin: 0; background: #fff; color: #262626; }
      main { max-width: 760px; margin: 0 auto; padding: 24px 16px 240px; }
      .user { background: #eff6ff; border-radius: 14px; padding: 10px 16px; margin: 16px 0 16px auto; width: fit-content; max-width: 70%; white-space: pre-wrap; }
      .ds-markdown { margin: 16px 0; }
      ._box { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); width: min(760px, calc(100% - 32px)); background: #f3f4f6; border-radius: 24px; padding: 14px 18px 52px; }
      textarea { width: 100%; border: 0; outline: none; resize: none; font: inherit; background: transparent; }
      ._row { position: absolute; left: 14px; right: 14px; bottom: 10px; display: flex; gap: 8px; align-items: center; }
      ._row [role="button"] { border: 1px solid #d1d5db; border-radius: 999px; padding: 3px 12px; font-size: 13px; cursor: pointer; background: #fff; }
      ._row ._send { margin-left: auto; width: 34px; height: 34px; padding: 0; border-radius: 50%; display: grid; place-items: center; background: #4d6bfe; color: #fff; border: 0; }
    </style>
    <script src="/fake-prosemirror.js"></script>
  </head>
  <body>
    <main id="thread"></main>
    <div class="_box">
      <textarea id="chat-input" rows="2" placeholder="Envía un mensaje a DeepSeek"></textarea>
      <div class="_row">
        <div role="button" class="_toggle">DeepThink (R1)</div>
        <div role="button" class="_toggle">Buscar</div>
        <div role="button" class="_attach" aria-label="Adjuntar">📎</div>
        <div role="button" class="_send" aria-disabled="false">↑</div>
      </div>
    </div>
    <script>
      window.__sent = [];
      window.__toggles = 0;
      const thread = document.getElementById("thread");
      const editor = FakeProseMirror.createTextarea(document.getElementById("chat-input"), { onSubmit: send });
      document.querySelector("._send").addEventListener("click", send);
      document.querySelectorAll("._toggle").forEach((t) => t.addEventListener("click", () => window.__toggles++));
      function send() {
        const text = editor.getText();
        if (!text.trim()) return;
        window.__sent.push(text);
        const u = document.createElement("div");
        u.className = "user";
        u.textContent = text;
        thread.append(u);
        editor.clear();
        if (!location.pathname.startsWith("/a/chat/s/")) history.pushState({}, "", "/a/chat/s/conv-deepseek-1");
      }
      window.__reply = async (text) => {
        const d = document.createElement("div");
        d.className = "ds-markdown";
        const p = document.createElement("p");
        d.append(p);
        thread.append(d);
        await FakeProseMirror.streamInto(p, text);
      };
    </script>
  </body>
</html>
